# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Can und must: Lok ohne Kupplung"
description: Sophie liest Schilder im Flur der Millbrook School. Du lernst, wie can, must und needn't vor einem zweiten Verb stehen und was sie bedeuten.
competencies: [can-must]
scope: Die Seite führt can, can't, must, mustn't und needn't ein. Can sagt, was jemand kann, und fragt, ob etwas erlaubt ist. Must sagt, was jemand tun muss, mustn't, was verboten ist, needn't, was jemand nicht tun muss. Can't heißt kann nicht und darf nicht. Die Verbkette hat eine Lok (das erste Verb), eine Kupplung und einen Wagen (das zweite Verb). Nach den Modalverben can und must gibt es keine Kupplung, also kein to, und sie bekommen nie ein -s. Fragen mit can stehen mit can vorn, ohne do. Deutsch nicht müssen heißt needn't, nicht dürfen heißt mustn't. Welche Kupplungen es sonst gibt, folgt später (would like auf der dritten Seite). Could, might und should folgen auf der nächsten Seite.
blocks:
  - type: section
    id: einstieg
    title: Zwei Schilder im Flur
    blocks:
      - type: figure
        image: images/szene-schilder.svg
        alt: Sophie, Peter und Amir stehen im Flur der Millbrook School. An der Wand hängen zwei Schilder. Auf dem einen steht "You mustn't run here.", auf dem anderen "You must wear a uniform."
        caption: "Von links nach rechts: Sophie (mit den Zöpfen), Peter (der Kleine) und Amir (mit Brille). An der Wand hängen zwei Schilder."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Sophie (11) läuft an ihrem ersten Tag durch den Flur der Millbrook School. Peter (9), der Bruder von Ellie, rennt an ihr vorbei. Amir (11) zeigt auf die zwei Schilder an der Wand. Auf jedem Schild stehen zwei Verben, zum Beispiel *run* (rennen) und *wear* (tragen). Das sind Wörter für etwas, das man tut.
      - type: table
        caption: Klassenzimmer-Poster · Neue Wörter
        header: [Wort, Bedeutung]
        rows:
          - [run, rennen]
          - [wear, tragen]
          - [uniform, Uniform]
          - [here, hier]
          - [coat, Mantel]
          - [swim, schwimmen]
          - [sing, singen]
          - [play football, Fußball spielen]
          - [ask, fragen]
          - [speak German, Deutsch sprechen]
          - [help, helfen]
      - type: text
        text: "**Das kannst du danach:** Mit can, can't, must, mustn't und needn't sagen, was jemand kann, was erlaubt oder verboten ist und was jemand tun muss oder nicht tun muss. Du siehst auch, wie das zweite Verb danach steht."
      - type: single-choice
        id: can-must-start
        text: Peter rennt durch den Flur. Welches Schild gilt für ihn?
        options:
          - text: You mustn't run here.
            correct: true
            info: "Run heißt rennen, das passt zu Peter."
          - text: You must wear a uniform.
            correct: false
            info: "Wear heißt tragen, hier geht es nicht ums Rennen."
        explanation: Auf dem Schild steht run, und Peter rennt.
        hint: Suche auf dem Poster das Wort, das zu rennen passt.
        links:
          - title: Lernlandkarte Englisch · Can, must und needn't
            url: https://lernapps.net/apps/map/englisch/c/can-must/
  - type: section
    id: neu
    title: Die Verbkette hat hier keine Kupplung
    blocks:
      - type: text
        text: |
          Stell dir einen kleinen Zug vor. Die **Lok** ist das erste Verb, zum Beispiel *can*. Sie zieht den **Wagen**, das zweite Verb, zum Beispiel *swim*. Zwischen Lok und Wagen kann eine **Kupplung** sitzen. Welche, bestimmt die Lok. Zusammen heißt das **Verbkette**. Eine Kupplung kann zum Beispiel *to* sein, wie in *I'd like to swim*. Das lernst du auf der dritten Seite. Bei *can* und *must* sitzt keine Kupplung dazwischen. Sie heißen Modalverben: Sie sagen, ob etwas geht, sein muss oder erlaubt ist.
      - type: figure
        image: images/verbkette-ohne-kupplung.svg
        alt: Ein kleiner Zug. Die blaue Lok trägt das Wort can, der gelbe Wagen das Wort swim. Zwischen ihnen sitzt keine Kupplung.
        caption: "Blau ist die Lok, gelb der Wagen. Schau, was zwischen den beiden Wörtern steht: nichts, auch kein to."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Can und must bekommen **nie ein -s**: *Amir can sing*, auch bei Amir oder Ellie. Dazwischen steht **kein to**: *Peter must run*. Can heißt „kann“, manchmal auch „darf“. Eine Frage fängt mit can an, ohne das Hilfswort do: *Can you play?*
      - type: table
        caption: Klassenzimmer-Poster · Modalverben
        header: [Ausdruck, Bedeutung]
        rows:
          - [Amir can sing., Amir kann singen. (Das kann er.)]
          - [Amir can't sing., Amir kann nicht singen. (Das kann er nicht.)]
          - [Can I ask a question?, "Darf ich eine Frage stellen? (Du fragst, ob es erlaubt ist.)"]
          - [You must wear a uniform., Du musst eine Uniform tragen. (Das ist Pflicht.)]
          - [You mustn't run here., Du darfst hier nicht rennen. (Das ist verboten.)]
          - [You needn't wear a coat., Du musst keinen Mantel tragen. (Das musst du nicht tun.)]
      - type: note
        title: Vorsicht bei „nicht müssen“
        blocks:
          - type: text
            text: |
              Auf Deutsch klingt „nicht müssen“ fast wie „nicht dürfen“. Auf Englisch sind es zwei Ausdrücke. **Mustn't** ist ein Verbot: Du darfst es nicht. **Needn't** heißt, dass du es nicht tun musst, aber du darfst es. **Can't** kann beides sein: „kann nicht“ (*Amir can't sing*) und „darf nicht“ (*You can't run here*). Mustn't ist dabei strenger.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: can-must-sortieren
        text: Welcher englische Satz passt zu welchem deutschen?
        pairs:
          - left: Ellie kann singen.
            right: Ellie can sing.
          - left: Peter muss eine Uniform tragen.
            right: Peter must wear a uniform.
          - left: Du darfst hier nicht spielen.
            right: You mustn't play here.
          - left: Amir muss nicht fragen.
            right: Amir needn't ask.
        distractors: [You needn't play here.]
        explanation: Can heißt „kann“, must „muss“, mustn't „darf nicht“ und needn't „muss nicht“.
        hint: Kann, muss, darf nicht oder muss nicht?
        links:
          - title: Lernlandkarte Englisch · Can, must und needn't
            url: https://lernapps.net/apps/map/englisch/c/can-must/
      - type: language-task
        id: can-must-kupplung
        languages: { source: de, target: en }
        mode: choice
        task: Welches Wort gehört in die Lücke?
        form: { case: hint, punctuation: hint }
        items:
          - cue: Ellie kann singen.
            target: "Ellie [can] sing."
            distractors: [[cans, can to]]
          - cue: Peter muss helfen.
            target: "Peter [must] help."
            distractors: [[musts, must to]]
          - cue: Ellie, kannst du mir helfen?
            target: "Ellie, [can] you help me?"
            distractors: [[cans, do can]]
          - cue: Peter kann nicht schwimmen.
            target: "Peter [can't] swim."
            distractors: [[can, needn't]]
        hint: Schau, was in der Verbkette zwischen den Verben steht.
      - type: single-choice
        id: can-must-needn
        text: "Peter ist schon fertig. Ellie darf ihm helfen, muss es aber nicht. Welcher Satz passt?"
        options:
          - text: Ellie needn't help.
            correct: true
            info: "Needn't heißt „muss nicht“: Es ist erlaubt, aber nicht nötig."
          - text: Ellie mustn't help.
            correct: false
            info: "Mustn't heißt „darf nicht“. Das wäre ein Verbot, Ellie darf aber helfen."
          - text: Ellie must help.
            correct: false
            info: "Must heißt „muss“. Das wäre eine Pflicht, Ellie muss aber nicht."
        explanation: Needn't heißt „muss nicht“, mustn't „darf nicht“.
        hint: Darf Ellie helfen? Muss sie?
        links:
          - title: Lernlandkarte Englisch · Can, must und needn't
            url: https://lernapps.net/apps/map/englisch/c/can-must/
      - type: ordering
        id: can-must-reihenfolge
        text: Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz entsteht.
        items: [Amir, can, speak, German.]
        explanation: Erst kommt wer, dann die Lok can, dann der Wagen speak.
        hint: Wer kann etwas? Danach kommen Lok und Wagen.
        links:
          - title: Lernlandkarte Englisch · Can, must und needn't
            url: https://lernapps.net/apps/map/englisch/c/can-must/
      - type: language-task
        id: can-must-schreiben
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: hint, apostrophe: ok }
        items:
          - source: Peter kann schwimmen.
            target: Peter can swim.
            mistakes:
              - answer: Peter cans swim.
                message: "Can bekommt nie ein -s, auch nicht bei Peter."
              - answer: Peter can to swim.
                message: "Zwischen can und dem zweiten Verb sitzt keine Kupplung, auch kein to."
          - source: Peter muss eine Uniform tragen.
            target: Peter must wear a uniform.
            mistakes:
              - answer: Peter must to wear a uniform.
                message: "Zwischen must und dem zweiten Verb sitzt keine Kupplung, auch kein to."
              - answer: Peter musts wear a uniform.
                message: "Must bekommt nie ein -s."
          - source: Du darfst hier nicht spielen.
            target: You (mustn't|can't|must not|cannot) play here.
            mistakes:
              - answer: You don't must play here.
                message: "Es gibt kein don't must. Schau auf das Poster, welches Wort „darf nicht“ heißt."
          - source: Kannst du mir helfen?
            target: Can you help me?
            mistakes:
              - answer: Do you can help me?
                message: "Can braucht kein do. In einer Frage steht can selbst vorn."
              - answer: Can you to help me?
                message: "Zwischen can und dem zweiten Verb sitzt keine Kupplung, auch kein to."
          - source: Amir muss nicht fragen.
            target: Amir (needn't|need not) ask.
            mistakes:
              - answer: Amir mustn't ask.
                message: "Mustn't ist ein Verbot („darf nicht“). Amir darf fragen, er muss nur nicht."
              - answer: Amir don't must ask.
                message: "Es gibt kein don't must. Schau auf das Poster, welches Wort „muss nicht“ heißt."
      - type: language-task
        id: can-must-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: hint, apostrophe: ok }
        items:
          - audio: you-must-wear-a-uniform.mp3
            target: You must wear a uniform.
          - audio: you-mustnt-run-here.mp3
            target: You (mustn't|must not) run here.
          - audio: amir-can-play-football.mp3
            target: Amir can play football.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: can-must-nachsprechen
        language: en
        items:
          - audio: peter-can-swim.mp3
            text: Peter can swim.
          - audio: can-you-help-me.mp3
            text: Can you help me?
          - audio: you-neednt-wear-a-coat.mp3
            text: You needn't wear a coat.
        hint: Hör zuerst zu, sprich dann nach und vergleiche.
      - type: open-task
        id: can-must-regeln
        task: "Sophie schreibt Regeln für das Klassenzimmer. Schreibe zwei kurze englische Sätze: eine Regel mit must und ein Verbot mit mustn't."
        points:
          - text: Ein Satz mit must und einem zweiten Verb, zum Beispiel You must wear a uniform.
            source: /koennen-muessen/can-must/#neu
          - text: Ein Satz mit mustn't und einem zweiten Verb, zum Beispiel You mustn't run here.
            source: /koennen-muessen/can-must/#neu
          - text: Nach must und mustn't steht kein to und kein -s.
            kind: form
        solution: |
          You must wear a uniform. You mustn't run here.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Sophie kennt jetzt die Regeln im Flur. Ellie fragt sie, was sie am Wochenende tun könnte. Auf der nächsten Seite sagst du, was möglich ist, was jemand sollte und was vielleicht passiert.
