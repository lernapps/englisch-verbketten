# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Das Passiv mit zwei Objekten: I was given a book"
description: Sophie schreibt Tagebuch über ihren Geburtstag. Du lernst, wie du bei Verben mit zwei Objekten sagst, was dir gegeben, gezeigt oder erzählt wurde.
competencies: [passiv-zwei-objekte]
scope: "Die Seite führt das persönliche Passiv ein. Verben wie give, offer, show, tell, send, hand, serve, lend, sell und pay haben zwei Objekte, eine Person und eine Sache (Mr Hill offered Ellie a seat). Im Passiv kann jedes der beiden Objekte nach vorn. Üblich ist die Person vorn (Ellie was offered a seat), die Sache folgt ohne to. Steht die Sache vorn, kommt die Person mit to dahinter (A seat was offered to Ellie). Bei buy und make kommt meist die Sache nach vorn, und die Person folgt mit for (A bag was bought for Amir); Amir was bought a bag klingt holprig. Die Lok richtet sich nach dem Wort vorn (I was, we were), die Kupplung zeigt wie auf den Seiten davor, dass die Lok vom Wagen die dritte Form verlangt, der Täter kann mit by folgen oder wegfallen. Das Lesestück ist ein erfundener Tagebucheintrag von Sophie an ihrem 14. Geburtstag, dem 14. Oktober; sie schreibt my mum and dad für ihre Eltern in Deutschland und Mrs Parker für ihre Gastmutter. Der Vokabelblock erklärt die Wörter des Textes. Die Seite beschließt das Kapitel und verweist auf die Selbsteinschätzung."
blocks:
  - type: section
    id: einstieg
    title: Sophies Tagebuch
    blocks:
      - type: text
        text: |
          Es ist der 14. Oktober, Sophie ist heute 14 geworden. Am Abend schreibt sie in ihr Tagebuch, was ihr an diesem Tag alles gegeben, gezeigt und erzählt wurde. Du kennst schon Mrs Parker (Sophies Gastmutter), Peter (11, Ellies Bruder), Amir, Ellie und Mr Hill. Neu sind Sophies Eltern in Deutschland: In ihrem Tagebuch schreibt sie von „my mum and dad“.
      - type: text
        text: "**Das kannst du danach:** bei Verben mit zwei Objekten das persönliche Passiv bilden (I was given a book.)."
      - type: single-choice
        id: zwei-objekte-start
        text: "Im Satz „My mum gave me a book.“ sind „me“ und „a book“ beide Objekte. Wer oder was ist die Person?"
        options:
          - text: me
            correct: true
            info: "Me ist die Person, die etwas bekommt. A book ist die Sache."
          - text: a book
            correct: false
            info: "A book ist die Sache, die gegeben wird, und keine Person."
          - text: gave
            correct: false
            info: "Gave ist das Verb und kein Objekt."
        explanation: Me ist die Person, a book ist die Sache. Das sind die zwei Objekte.
        hint: Frag dich, wer etwas bekommt.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
  - type: section
    id: lesen
    title: "Sophie's diary · 14 October"
    blocks:
      - type: text
        text: |
          **Dear diary,**

          I'm fourteen today! The day started with a surprise. At breakfast I was given a warm scarf by Mrs Parker. Then Peter asked me to close my eyes. When I opened them, there was a big chocolate cake with fourteen candles. Peter made it himself.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: a surprise
            source: eine Überraschung
          - target: a scarf
            source: ein Schal
          - target: a candle
            source: eine Kerze
          - target: give
            source: geben, schenken
            forms: [gave, given]
            example:
              { target: "My uncle gives me a book every year.", source: "Mein Onkel schenkt mir jedes Jahr ein Buch." }
      - type: true-false
        id: zwei-objekte-zwischen-eins
        text: Mrs Parker hat Sophie einen Schal geschenkt.
        answer: true
        explanation: Sophie schreibt, dass ihr ein warmer Schal von Mrs Parker gegeben wurde.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: text
        text: |
          At school Amir and Ellie were waiting for me. Amir had his birthday two days ago, so he knew exactly what to do. I was handed a small box by him, and inside were two cinema tickets! Then I was shown a video by Ellie: the whole class sang "Happy Birthday" for me.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: hand
            source: reichen, geben
            example: { target: "Please hand me the salt.", source: "Reich mir bitte das Salz." }
          - target: a ticket
            source: eine Eintrittskarte
            forms: [tickets]
          - target: exactly
            source: genau
          - target: sing
            source: singen
            forms: [sang, sung]
      - type: single-choice
        id: zwei-objekte-zwischen-zwei
        text: Wer hat Sophie die Kinokarten gegeben?
        options:
          - text: Amir
            correct: true
            info: Sophie bekam eine kleine Schachtel von Amir, darin lagen zwei Kinokarten.
          - text: Ellie
            correct: false
            info: Ellie hat Sophie ein Video gezeigt.
          - text: Mrs Parker
            correct: false
            info: Mrs Parker hat Sophie den Schal gegeben.
        explanation: Die Kinokarten waren in der Schachtel, die Sophie von Amir bekam.
        hint: Lies den Abschnitt über die Schule noch einmal.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: text
        text: |
          In the evening Mr Hill sent me a message. I was told that there is no homework for me tonight, because it is my birthday! My mum and dad called from Germany, too. I was asked a hundred questions about the day. At dinner I was offered a second piece of cake, but I was too full. What a day! The best present was my friends.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: offer
            source: anbieten
            example: { target: "Can I offer you a cup of tea?", source: "Darf ich dir eine Tasse Tee anbieten?" }
          - target: be full
            source: satt sein
  - type: section
    id: verstehen
    title: Verstehen, belegen, meinen
    blocks:
      - type: single-choice
        id: zwei-objekte-verstehen
        text: Warum wusste Amir genau, was er tun musste?
        options:
          - text: Er hatte selbst zwei Tage vorher Geburtstag gehabt.
            correct: true
            info: Im Tagebuch steht, dass Amirs Geburtstag zwei Tage her war.
          - text: Mr Hill hatte es ihm gesagt.
            correct: false
            info: Mr Hill schreibt Sophie eine Nachricht, aber von Amir steht dort nichts.
          - text: Ellie hatte ihn danach gefragt.
            correct: false
            info: Ellie hat Sophie ein Video gezeigt. Das hat mit Amirs Wissen nichts zu tun.
        explanation: Amir hatte seinen Geburtstag erst zwei Tage vorher und wusste deshalb, was er tun musste.
        hint: Lies den Satz mit two days ago.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: single-choice
        id: zwei-objekte-belegen
        text: Welcher Satz aus dem Tagebuch zeigt, dass Sophie heute keine Hausaufgaben machen muss?
        options:
          - text: I was told that there is no homework for me tonight, because it is my birthday!
            correct: true
            info: No homework heißt „keine Hausaufgaben“, tonight heißt „heute Abend“.
          - text: I was asked a hundred questions about the day.
            correct: false
            info: Dieser Satz sagt, dass Sophie viele Fragen beantworten musste, und nicht, dass es keine Hausaufgaben gibt.
          - text: I was handed a small box by him, and inside were two cinema tickets!
            correct: false
            info: Dieser Satz erzählt von dem Geschenk von Amir und nicht von Hausaufgaben.
        explanation: Der Satz mit no homework zeigt, dass Sophie heute Abend nichts für die Schule tun muss.
        hint: Suche das Wort homework.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: open-task
        id: zwei-objekte-meinung
        task: "Sophie schreibt: „The best present was my friends.“ Stimmst du ihr zu? Schreibe zwei bis drei Sätze auf Deutsch oder Englisch und nenne einen Grund."
        points:
          - text: Eine klare Meinung (ich stimme zu oder nicht).
            kind: form
          - text: Ein Grund für die Meinung.
            kind: form
        solution: |
          Ich stimme ihr zu, weil man sich an Zeit mit Freunden länger erinnert als an ein Geschenk.
  - type: section
    id: neu
    title: Die Person kommt nach vorn
    blocks:
      - type: text
        text: |
          Manche Verben haben zwei Objekte: eine **Person** und eine **Sache**. In *Mr Hill offered Ellie a seat* ist Ellie die Person und *a seat* die Sache. Im Passiv kann jedes der beiden Objekte nach vorn. Am häufigsten steht die Person vorn: *Ellie was offered a seat.* Die Sache bleibt hinter dem Verb, ohne to.

          Die Verbkette ändert sich nicht, im Bild siehst du sie unten: Die Lok ist eine Form von *be*, die Kupplung zeigt, dass die Lok vom Wagen die dritte Form verlangt (*offered*). Neu ist nur, dass hinter dem Wagen noch die Sache steht.
      - type: figure
        image: images/satz-zwei-objekte.svg
        alt: Drei Zeilen. Oben der Satz im Aktiv, Mr Hill offered Ellie a seat. Darunter zwei Sätze im Passiv, einmal Ellie was offered a seat und einmal A seat was offered to Ellie, jeweils mit klein angehängtem by Mr Hill. Ganz unten die Verbkette der Passivsätze, die blaue Lok was, die rosa Kupplung 3. Form und der gelbe Wagen offered.
        caption: "Die Person und die Sache können beide nach vorn. Steht die Sache vorn, folgt die Person mit to. Unten siehst du die Verbkette: Lok was, Kupplung 3. Form, Wagen offered."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Das Passiv
        header: [Satz, Wer oder was steht vorn?]
        rows:
          - [Ellie was offered a seat., die Person]
          - [I was offered a seat by Mr Hill., die Person (mit Täter)]
          - [A seat was offered to Ellie., die Sache (Person mit to)]
          - [A bag was bought for Amir., die Sache (Person mit for)]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Person vorn:** *Person + be + dritte Form + Sache.* Das ist der übliche Weg: *I was offered a seat.*

              **Sache vorn:** *Sache + be + dritte Form + to + Person.* Das klingt seltener: *A seat was offered to me.*

              Das persönliche Passiv klingt natürlich bei *give, offer, show, tell, send, hand, serve, lend, sell, pay*. Bei *buy* und *make* kommt meist die Sache nach vorn, und die Person folgt mit **for**: *A bag was bought for Amir.* Holprig klingt dagegen *Amir was bought a bag.*

              Die Lok richtet sich nach dem Wort vorn (*I was*, *we were*, *he was*). Den Täter schließt du mit by an oder lässt ihn weg.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: zwei-objekte-sortieren
        text: Welcher Passivsatz passt zu welchem Aktivsatz?
        pairs:
          - left: Mr Hill sent Amir an email.
            right: Amir was sent an email by Mr Hill.
          - left: Mrs Parker showed Peter the way.
            right: Peter was shown the way by Mrs Parker.
          - left: Ellie told Peter a secret.
            right: Peter was told a secret by Ellie.
        distractors:
          [
            Amir was send an email by Mr Hill.,
            Peter were told a secret by Ellie.,
            Peter was showed the way by Mrs Parker.,
          ]
        explanation: Die Person steht vorn, dann folgen be und die dritte Form, danach die Sache und zuletzt der Täter mit by.
        hint: Achte darauf, ob eins oder mehrere vorn stehen, und ob der Wagen in der dritten Form fährt.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: language-task
        id: zwei-objekte-wahl
        languages: { source: de, target: en }
        mode: choice
        task: Welche Form gehört in die Lücke?
        form: { case: hint, punctuation: ok }
        items:
          - cue: Amir bekam ein Buch geliehen.
            target: "Amir [was lent] a book."
            distractors: [[were lent, was lended]]
          - cue: Ellie bekam ein Glas Wasser gebracht.
            target: "Ellie [was brought] a glass of water."
            distractors: [[were brought, was bring]]
          - cue: Den Kindern wird ein Film gezeigt.
            target: "The children [are shown] a film."
            distractors: [[is shown, are show]]
          - cue: Uns wurde ein Zimmer angeboten.
            target: "We [were offered] a room."
            distractors: [[was offered, were offer]]
        hint: "Prüfe: Steht vorn eine Person (was, is) oder stehen mehrere vorn (were, are)? Zeigt die Lok die Vergangenheit oder die Gegenwart? Und fährt der Wagen in der dritten Form, nicht in der Grundform und nicht mit angehängtem -ed, wenn das Verb unregelmäßig ist?"
        explanation: Die Lok richtet sich nach dem Wort vorn und nach der Zeit, der Wagen fährt in der dritten Form, und die Sache steht dahinter.
      - type: ordering
        id: zwei-objekte-reihenfolge
        text: Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz entsteht.
        items: [Amir, was, given, a, new, football.]
        explanation: Erst kommt die Person (Amir), dann die Lok was, dann der Wagen given und zuletzt die Sache.
        hint: Die Sache steht ganz am Ende, ohne to.
        links:
          - title: Lernlandkarte Englisch · Das Passiv mit zwei Objekten
            url: https://lernapps.net/apps/map/englisch/c/passiv-zwei-objekte/
      - type: language-task
        id: zwei-objekte-umdrehen
        languages: { source: de, target: en }
        task: "Dreh den Satz um: Schreibe ihn im Passiv, die Person soll vorn stehen. Den Täter darfst du weglassen."
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: Mrs Parker gave Peter a ticket.
            target: Peter was given a ticket( by Mrs Parker|).
            mistakes:
              - answer: Peter was gave a ticket.
                message: "Der Wagen braucht die dritte Form: given, nicht gave."
              - answer: Peter were given a ticket.
                message: "Peter ist einer, darum braucht die Lok was, nicht were."
              - answer: Peter given a ticket.
                message: "Die Lok fehlt. Vor given muss was stehen."
              - answer: Peter was gived a ticket.
                message: "Give ist unregelmäßig: Die dritte Form heißt given, nicht gived."
          - cue: Mr Hill asked Ellie a hard question.
            target: Ellie was asked a hard question( by Mr Hill|).
            mistakes:
              - answer: Ellie was ask a hard question.
                message: "Der Wagen braucht die dritte Form: asked, mit -ed."
              - answer: Ellie were asked a hard question.
                message: "Ellie ist eine Person, darum braucht die Lok was, nicht were."
              - answer: Ellie was asked to a hard question.
                message: "Vor der Sache steht kein to."
              - answer: Ellie was asked by Mr Hill to a hard question.
                message: "Vor der Sache steht kein to."
          - cue: Mr Hill taught the class a new song.
            target: The class (was|were) taught a new song( by Mr Hill|).
            mistakes:
              - answer: The class was teached a new song.
                message: "Teach ist unregelmäßig: Die dritte Form heißt taught."
              - answer: The class taught a new song by Mr Hill.
                message: "Die Lok fehlt. Vor taught muss was oder were stehen."
              - answer: The class is taught a new song.
                message: "Der Satz stand in der Vergangenheit, darum braucht die Lok was oder were."
      - type: language-task
        id: zwei-objekte-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - audio: our-guests-were-served-a-lovely-dinner.mp3
            target: Our guests were served a lovely dinner.
          - audio: we-were-handed-a-map-at-the-door.mp3
            target: We were handed a map at the door.
          - audio: students-are-given-homework-every-day.mp3
            target: Students are given homework every day.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: zwei-objekte-nachsprechen
        language: en
        items:
          - audio: were-you-told-the-news-yesterday.mp3
            text: Were you told the news yesterday?
          - audio: i-was-sent-a-lot-of-messages-on-my-birthday.mp3
            text: I was sent a lot of messages on my birthday.
          - audio: were-all-the-children-given-a-present.mp3
            text: Were all the children given a present?
        hint: Hör zuerst zu, sprich dann nach und vergleiche.
      - type: open-task
        id: zwei-objekte-anwenden
        task: "Schreibe einen kurzen Tagebucheintrag über einen schönen Tag (er darf erfunden sein). Benutze drei Sätze im Passiv mit zwei Objekten, zum Beispiel mit give, show, tell, offer oder send: Was wurde dir gegeben, gezeigt oder erzählt? Die Person (I) soll vorn stehen."
        points:
          - text: Drei Sätze im Passiv mit I (oder we) vorn.
            source: /das-passiv/passiv-zwei-objekte/#neu
          - text: Die Lok passt (I was, we were) und der Wagen fährt in der dritten Form.
            source: /das-passiv/passiv-zwei-objekte/#neu
          - text: Hinter dem Wagen steht die Sache ohne to.
            source: /das-passiv/passiv-zwei-objekte/#neu
        solution: |
          I was given a new bike. I was shown the way to the park. We were told a funny story.
  - type: section
    id: weiter
    title: Rückblick auf die Kette
    blocks:
      - type: text
        text: "Damit kennst du die Verbketten dieses Kapitels. Beim Passiv ist be die Lok, und die Kupplung zeigt, dass die Lok vom Wagen die dritte Form verlangt. Das Passiv passt in jede Zeit und hinter jedes Modalverb, und bei Verben mit zwei Objekten steht meist die Person vorn (I was given a scarf). Wie sicher du schon bist, kannst du auf der Seite zur Selbsteinschätzung dieses Kapitels prüfen."
