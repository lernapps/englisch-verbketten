# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Das Passiv: is made, was made"
description: Die Schulzeitung berichtet über das Herbstfest. Du lernst, wie du mit be und der dritten Form Sätze im Passiv bildest und mit by sagst, wer etwas getan hat.
competencies: [passiv]
scope: "Die Seite führt das Passiv im simple present und im simple past ein. Im Aktiv steht vorn, wer etwas tut (The bakers make bread). Im Passiv kommt das, was getan wird, nach vorn (Bread is made), und wer es getan hat, wird klein (by the bakers) oder fällt weg. Das Passiv ist be plus dritte Form des Verbs. Die Lok ist eine Form von be (is, are, was, were) und zeigt die Zeit und ob es eins oder mehrere sind. Die Kupplung ist die Form, die die Lok vom Wagen verlangt: Beim Passiv fährt der Wagen in der dritten Form (made, written, cleaned). Dieselbe Beschreibung gilt auf allen Seiten des Kapitels. Das Lesestück ist ein erfundener Bericht der Schulzeitung Millbrook Times über ein Herbstfest (Samstag, 19. September; Sophie ist noch 13). Der Bericht erzählt in der Vergangenheit; eine Gewohnheit steht mit As every year. Die Seite führt die Personen des Kapitels ein: Sophie, Ellie, Amir, Peter, Mr Hill, Mrs Parker. Der Vokabelblock erklärt die Wörter des Textes. Nicht auf dieser Seite sind das Passiv in weiteren Zeiten (present perfect, will-future, mit Modalverben) und Verben mit zwei Objekten."
blocks:
  - type: section
    id: einstieg
    title: Die Schulzeitung berichtet
    blocks:
      - type: text
        text: |
          Es ist Montag, der 21. September. Die Schulzeitung „Millbrook Times“ hat einen Bericht über das Herbstfest vom Wochenende gedruckt. Sophie (13) liest ihn in der Pause. Sie kommt aus Deutschland und wohnt bei der Familie Parker. Im Bericht kommen ihre Klassenkameraden Ellie (13) und Amir (13) vor, ihr Englischlehrer Mr Hill, Mrs Parker (Ellies Mutter und Sophies Gastmutter) und Ellies Bruder Peter (11). Der Bericht erzählt, was beim Fest geschah, und oft auch, wer es getan hat.
      - type: text
        text: "**Das kannst du danach:** Sätze im Passiv bilden (is made, was made) und mit by sagen, wer etwas getan hat."
      - type: single-choice
        id: passiv-start
        text: "Auf der Wiederholungsseite ging es um die dritte Form der Verben. Welche Form ist die dritte Form von „drink“?"
        options:
          - text: drunk
            correct: true
            info: "Genau: drink – drank – drunk. In dieser Form fährt später der Wagen im Passiv."
          - text: drank
            correct: false
            info: "Drank ist die Vergangenheit (simple past). Die dritte Form ist die letzte der drei Formen."
          - text: drinked
            correct: false
            info: "Drink ist ein unregelmäßiges Verb und bekommt kein -ed. Solche Verben lernst du in drei Formen."
        explanation: Die drei Formen von drink sind drink, drank, drunk. Die dritte Form brauchst du in diesem Kapitel immer wieder.
        hint: Denk an go – went – gone. Die dritte Form steht an dritter Stelle.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
  - type: section
    id: lesen
    title: "Millbrook Times: Der Bericht"
    blocks:
      - type: text
        text: |
          **Millbrook Times · Monday, 21 September · A fair for everyone**

          Last Saturday the autumn fair was held in the main hall. It was organised by Mr Hill's class, and the hall was decorated with paper flags. A big stage was built by the older students. About two hundred people were welcomed at the door. Hot drinks were made in the school kitchen, and biscuits were baked by the parents.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: hold
            source: abhalten, veranstalten
            forms: [held, held]
            example:
              {
                target: "A concert is held in the park every summer.",
                source: "Jeden Sommer wird im Park ein Konzert veranstaltet.",
              }
          - target: organise
            source: organisieren
          - target: decorate
            source: schmücken
            example:
              {
                target: "We decorated the room with balloons.",
                source: "Wir haben den Raum mit Luftballons geschmückt.",
              }
          - target: a stage
            source: eine Bühne
          - target: welcome
            source: begrüßen, willkommen heißen
            example:
              { target: "Our teacher welcomes us every morning.", source: "Unser Lehrer begrüßt uns jeden Morgen." }
      - type: true-false
        id: passiv-zwischen-eins
        text: Die Bühne wurde von den Lehrern gebaut.
        answer: false
        explanation: Die Bühne wurde von den älteren Schülern gebaut.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: text
        text: |
          A lot of food was sold at the stalls. Mrs Parker's carrot cake was eaten in ten minutes! Tea and coffee were served by the parents, and the money was collected in a big jar. As every year, it is used for new books for the school library.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: a stall
            source: ein Verkaufsstand
          - target: serve
            source: servieren, ausgeben
            example: { target: "Lunch is served at noon.", source: "Das Mittagessen wird um zwölf Uhr serviert." }
          - target: collect
            source: sammeln, einsammeln
            example: { target: "Peter collects football cards.", source: "Peter sammelt Fußballkarten." }
          - target: a jar
            source: ein Glas (zum Aufbewahren)
      - type: single-choice
        id: passiv-zwischen-zwei
        text: Wofür wird das Geld jedes Jahr benutzt?
        options:
          - text: Für neue Bücher in der Schulbibliothek.
            correct: true
            info: Im Bericht steht, dass das Geld für neue Bücher benutzt wird.
          - text: Für eine neue Bühne.
            correct: false
            info: Die Bühne wurde von den älteren Schülern gebaut. Mit dem Geld hat sie nichts zu tun.
          - text: Für Papierfahnen.
            correct: false
            info: Die Papierfahnen hingen schon in der Halle. Von Geld dafür steht nichts da.
        explanation: Das Geld wird für neue Bücher in der Schulbibliothek benutzt.
        hint: Lies den Satz mit as every year noch einmal.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: text
        text: |
          In the afternoon a short play was performed by Sophie, Ellie and Amir. Peter's drawings were shown on the wall, and a prize was won by his class. Then the fair was finished with a song, and the hall was cleaned by everybody. Everybody says it was the best fair of the year.
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: perform
            source: aufführen, vorführen
          - target: a play
            source: ein Theaterstück
          - target: a prize
            source: ein Preis
          - target: win
            source: gewinnen
            forms: [won, won]
          - target: finish with a song
            source: mit einem Lied enden
            example:
              { target: "We finish every lesson with a game.", source: "Wir beenden jede Stunde mit einem Spiel." }
  - type: section
    id: verstehen
    title: Verstehen, belegen, meinen
    blocks:
      - type: single-choice
        id: passiv-verstehen
        text: Was haben Sophie, Ellie und Amir am Nachmittag gemacht?
        options:
          - text: Sie haben ein kurzes Theaterstück aufgeführt.
            correct: true
            info: Im Bericht steht, dass ein kurzes Stück von den dreien aufgeführt wurde.
          - text: Sie haben Kuchen verkauft.
            correct: false
            info: Der Kuchen kam von Mrs Parker, und das Essen wurde an den Ständen verkauft. Von den dreien steht dort nichts.
          - text: Sie haben die Bühne gebaut.
            correct: false
            info: Die Bühne haben die älteren Schüler gebaut.
        explanation: Sophie, Ellie und Amir haben am Nachmittag ein kurzes Stück aufgeführt.
        hint: Lies den letzten Textabschnitt noch einmal.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: single-choice
        id: passiv-belegen
        text: Welcher Satz aus dem Bericht sagt, dass der Kuchen sehr schnell weg war?
        options:
          - text: "Mrs Parker's carrot cake was eaten in ten minutes!"
            correct: true
            info: In ten minutes heißt „in zehn Minuten“. So schnell war der Kuchen weg.
          - text: A lot of food was sold at the stalls.
            correct: false
            info: Der Satz sagt nur, dass viel Essen verkauft wurde. Nach der Zeit wird nicht gefragt.
          - text: The money was collected in a big jar.
            correct: false
            info: Dieser Satz handelt vom Geld und nicht vom Kuchen.
        explanation: Der Satz mit in ten minutes belegt, dass der Kuchen schnell weg war.
        hint: Achte auf die Zeitangabe.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: open-task
        id: passiv-meinung
        task: "Welche Aufgabe hättest du beim Herbstfest am liebsten übernommen? Schreibe zwei bis drei Sätze auf Deutsch oder Englisch und nenne einen Grund."
        points:
          - text: Eine klare Aussage, welche Aufgabe du übernehmen würdest.
            kind: form
          - text: Ein Grund, warum du diese Aufgabe gewählt hast.
            kind: form
        solution: |
          Ich hätte am liebsten die Bühne gebaut, weil ich gern mit Holz arbeite und man am Ende sieht, was man geschafft hat.
  - type: section
    id: neu
    title: be und die dritte Form
    blocks:
      - type: text
        text: |
          Im **Aktiv** steht vorn, wer etwas tut: *The bakers make bread.* Im **Passiv** kommt das nach vorn, was getan wird: *Bread is made.* Wer es getan hat, wird klein (*by the bakers*) oder fällt ganz weg. Das Passiv benutzt du, wenn das Ergebnis wichtiger ist als der Täter, zum Beispiel in Berichten.

          In der Verbkette ist das eine neue Kupplung. Beim Passiv ist *be* die Lok (*is*, *are*, *was*, *were*). Die Kupplung zeigt, welche Form die Lok vom Wagen verlangt: Der Wagen fährt in der **dritten Form** (*made*).
      - type: figure
        image: images/verbkette-passiv.svg
        alt: Ein kleiner Zug. Die blaue Lok trägt das Wort is, dann folgt die rosa Kupplung mit den Worten 3. Form, danach der gelbe Wagen mit dem Wort made. Darunter steht, dass die Lok be vom Wagen die dritte Form verlangt.
        caption: "Von links: Lok is (eine Form von be), Kupplung 3. Form, Wagen made. Die Lok verlangt vom Wagen die dritte Form."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: figure
        image: images/satz-umdrehen.svg
        alt: Oben der Satz im Aktiv mit drei Kästchen, The bakers, make und bread. Unten der Satz im Passiv, Bread, die blaue Lok is, die gelbe dritte Form made und klein daneben by the bakers. Zwei Pfeile zeigen, dass bread und the bakers die Plätze tauschen.
        caption: Beim Umdrehen tauschen bread und the bakers die Plätze. Aus make wird die Kette is made, und der Täter wird klein und bekommt by.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Das Passiv
        header: [Zeit, Aktiv, Passiv]
        rows:
          - [simple present, The bakers make bread., Bread is made by the bakers.]
          - [simple present, People speak English here., English is spoken here.]
          - [simple past, The bakers made the rolls., The rolls were made by the bakers.]
          - [simple past, Someone painted the walls., The walls were painted.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Das Passiv bildest du mit **be + dritte Form**. Die Lok *is*, *are*, *was* oder *were* zeigt die Zeit und richtet sich nach dem Wort vorn: *The roll is made*, aber *The rolls are made*.

              Bei regelmäßigen Verben ist die dritte Form wie die Vergangenheit (*painted*). Bei unregelmäßigen Verben lernst du sie: *make – made – made*, *speak – spoke – spoken*.

              Wer etwas getan hat, steht hinter **by**, nie hinter *from*. Ist der Täter unbekannt oder unwichtig, lässt du *by …* weg.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: passiv-sortieren
        text: Welcher Passivsatz passt zu welchem Aktivsatz?
        pairs:
          - left: Amir writes the letter.
            right: The letter is written by Amir.
          - left: Peter broke the cup.
            right: The cup was broken by Peter.
          - left: Mrs Parker bought the biscuits.
            right: The biscuits were bought by Mrs Parker.
        distractors: [The cup was broke by Peter., The biscuits was bought by Mrs Parker.]
        explanation: Die Lok zeigt Zeit und Zahl (is, was, were), und der Wagen fährt in der dritten Form.
        hint: Achte auf die Zeit und darauf, ob es eins oder mehrere sind.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: language-task
        id: passiv-wahl
        languages: { source: de, target: en }
        mode: choice
        task: Welche Form gehört in die Lücke?
        form: { case: hint, punctuation: ok }
        items:
          - cue: Der Film wurde von vielen Kindern gesehen.
            target: "The film [was seen] by many children."
            distractors: [[was saw, were seen]]
          - cue: Die Fotos werden von Amir gemacht.
            target: "The photos [are taken] by Amir."
            distractors: [[is taken, are took]]
          - cue: Die Bilder wurden von Ellie gezeichnet.
            target: "The pictures [were drawn] by Ellie."
            distractors: [[was drawn, were draw]]
          - cue: Die Tasche ging am Montag verloren.
            target: "The bag [was lost] on Monday."
            distractors: [[was lose, were lost]]
        hint: "Prüfe drei Dinge: Zeigt die Lok die Vergangenheit (was, were) oder die Gegenwart (is, are)? Steht das Wort vorn für eins (was, is) oder für mehrere (were, are)? Und fährt der Wagen in der dritten Form (bei see, take, draw nicht -ed, nicht die Grundform)?"
        explanation: Die Lok richtet sich nach Zeit und Zahl (is, are, was, were), der Wagen fährt in der dritten Form.
      - type: ordering
        id: passiv-reihenfolge
        text: Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz im Passiv entsteht.
        items: [The, soup, was, cooked, by, Ellie.]
        explanation: Erst kommt das, was getan wurde (The soup), dann die Lok was, dann der Wagen cooked in der dritten Form und zuletzt der Täter mit by.
        hint: Der Satz beginnt mit dem, was gekocht wurde. Danach folgen Lok und Wagen, und am Schluss sagst du, von wem.
        links:
          - title: Lernlandkarte Englisch · Das Passiv
            url: https://lernapps.net/apps/map/englisch/c/passiv/
      - type: language-task
        id: passiv-umdrehen
        languages: { source: de, target: en }
        task: "Dreh den Satz um: Schreibe ihn im Passiv und nenne den Täter mit by."
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - cue: Ellie sent the postcards.
            target: The postcards were sent by Ellie.
            mistakes:
              - answer: The postcards was sent by Ellie.
                message: "Postcards ist Plural, darum braucht die Lok were, nicht was."
              - answer: The postcards were send by Ellie.
                message: "Nach be fährt der Wagen in der dritten Form: sent, nicht send."
              - answer: The postcards were sent from Ellie.
                message: "Der Täter wird mit by angeschlossen, nicht mit from."
              - answer: The postcards were sended by Ellie.
                message: "Send ist unregelmäßig: Die dritte Form heißt sent, nicht sended."
          - cue: Amir found the key yesterday.
            target: "(The key was found by Amir yesterday|Yesterday the key was found by Amir|The key was found yesterday by Amir)."
            mistakes:
              - answer: The key were found by Amir yesterday.
                message: "Key ist einer, darum braucht die Lok was, nicht were."
              - answer: The key was find by Amir yesterday.
                message: "Hinter was fährt der Wagen in der dritten Form: found, nicht find."
              - answer: The key was finded by Amir yesterday.
                message: "Find ist unregelmäßig: Die dritte Form heißt found, nicht finded."
              - answer: The key was found Amir yesterday.
                message: "Vor Amir fehlt das Wort by."
          - cue: Mr Hill checks the tests.
            target: The tests are checked by Mr Hill.
            mistakes:
              - answer: The tests is checked by Mr Hill.
                message: "Tests ist Plural, darum braucht die Lok are, nicht is."
              - answer: The tests are check by Mr Hill.
                message: "Der Wagen braucht die dritte Form: checked, mit -ed."
              - answer: The tests checked by Mr Hill.
                message: "Die Lok fehlt. Vor checked muss are stehen."
              - answer: The tests are checked from Mr Hill.
                message: "Der Täter wird mit by angeschlossen, nicht mit from."
      - type: language-task
        id: passiv-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok, apostrophe: ok }
        items:
          - audio: football-is-played-in-the-park-every-sunday.mp3
            target: Football is played in the park every Sunday.
          - audio: the-gate-was-closed-at-night.mp3
            target: The gate was closed at night.
          - audio: our-class-was-invited-to-the-party.mp3
            target: Our class was invited to the party.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: passiv-nachsprechen
        language: en
        items:
          - audio: the-museum-is-opened-at-ten.mp3
            text: The museum is opened at ten.
          - audio: my-bike-was-washed-by-my-brother.mp3
            text: My bike was washed by my brother.
          - audio: is-this-game-played-in-your-country.mp3
            text: Is this game played in your country?
        hint: Hör zuerst zu, sprich dann nach und vergleiche.
      - type: open-task
        id: passiv-anwenden
        task: "Du schreibst für die Schulzeitung über ein Fest an deiner Schule (es darf erfunden sein). Schreibe drei Sätze im Passiv. Nenne in mindestens einem Satz den Täter mit by."
        points:
          - text: Drei Sätze im Passiv mit einer Form von be und der dritten Form des Verbs.
            source: /das-passiv/passiv/#neu
          - text: Mindestens ein Täter mit by.
            source: /das-passiv/passiv/#neu
          - text: Die Lok passt zur Zeit und zu eins oder mehrere (was oder were, is oder are).
            kind: form
        solution: |
          The room was decorated by the class. The tickets were sold at the door. The games are organised by the teachers.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Schon bald ist das nächste Fest geplant: das große Schulfest am Samstag, dem 10. Oktober. Am Donnerstagabend davor, dem 8. Oktober, chattet Mr Hill mit Sophie, Ellie und Amir darüber, was schon erledigt ist und was noch fehlt. Auf der nächsten Seite liest du den Chat und lernst, wie das Passiv auch mit has been, will be und can be funktioniert."
