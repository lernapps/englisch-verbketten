<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img">
  <title>Eine lange Verbkette: Die Lok will zieht den Wagen have, dieser zieht über die Kupplung to den Wagen go</title>
  <rect width="560" height="170" fill="#f4efe2"/>
  <rect x="14" y="30" width="120" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="74" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">will</text>
  <rect x="144" y="30" width="120" height="64" rx="10" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="204" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">have</text>
  <rect x="264" y="52" width="46" height="22" rx="11" fill="#ffd2d2" stroke="#333" stroke-width="3"/>
  <text x="287" y="69" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#222">to</text>
  <rect x="310" y="30" width="120" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="370" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">go</text>
  <circle cx="44" cy="104" r="10" fill="#333"/><circle cx="104" cy="104" r="10" fill="#333"/>
  <circle cx="174" cy="104" r="10" fill="#333"/><circle cx="234" cy="104" r="10" fill="#333"/>
  <circle cx="340" cy="104" r="10" fill="#333"/><circle cx="400" cy="104" r="10" fill="#333"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222">
    <text x="74" y="132">Lok</text>
    <text x="204" y="132">Wagen und neue Lok</text>
    <text x="287" y="132">Kupplung</text>
    <text x="370" y="132">Wagen</text>
  </g>
</svg>
