<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" role="img">
  <title>Zwei Objekte: Aus Mr Hill offered Ellie a seat werden zwei Passivsätze, einer mit der Person vorn und einer mit der Sache vorn</title>
  <rect width="520" height="270" fill="#f4efe2"/>
  <g font-family="sans-serif" fill="#222" text-anchor="middle" stroke-linejoin="round">
    <text x="30" y="52" font-size="13">Aktiv</text>
    <text x="30" y="142" font-size="13">Passiv 1</text>
    <text x="30" y="232" font-size="13">Passiv 2</text>
    <g stroke="#333" stroke-width="3" font-size="19">
      <rect x="62" y="25" width="100" height="50" rx="8" fill="#ffe0b3"/>
      <rect x="168" y="25" width="100" height="50" rx="8" fill="#d9ecff"/>
      <rect x="274" y="25" width="90" height="50" rx="8" fill="#e8dcff"/>
      <rect x="370" y="25" width="100" height="50" rx="8" fill="#d8f0d0"/>
      <rect x="62" y="115" width="90" height="50" rx="8" fill="#e8dcff"/>
      <rect x="158" y="115" width="150" height="50" rx="8" fill="#d9ecff"/>
      <rect x="314" y="115" width="90" height="50" rx="8" fill="#d8f0d0"/>
      <rect x="62" y="205" width="90" height="50" rx="8" fill="#d8f0d0"/>
      <rect x="158" y="205" width="150" height="50" rx="8" fill="#d9ecff"/>
      <rect x="314" y="205" width="90" height="50" rx="8" fill="#e8dcff"/>
    </g>
    <g stroke="#333" stroke-width="2" stroke-dasharray="6 4" fill="#ffe0b3">
      <rect x="410" y="123" width="100" height="34" rx="8"/>
      <rect x="410" y="213" width="100" height="34" rx="8"/>
    </g>
    <g font-size="19">
      <text x="112" y="57">Mr Hill</text><text x="218" y="57">offered</text><text x="319" y="57">Ellie</text><text x="420" y="57">a seat</text>
      <text x="107" y="147">Ellie</text><text x="233" y="147">was offered</text><text x="359" y="147">a seat</text>
      <text x="107" y="237">A seat</text><text x="233" y="237">was offered</text><text x="359" y="237">to Ellie</text>
    </g>
    <g font-size="15"><text x="460" y="145">by Mr Hill</text><text x="460" y="235">by Mr Hill</text></g>
  </g>
</svg>
