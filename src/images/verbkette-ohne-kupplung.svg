<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img">
  <title>Eine Verbkette ohne Kupplung: Die Lok can steht direkt vor dem Wagen swim</title>
  <rect width="420" height="150" fill="#f4efe2"/>
  <rect x="20" y="30" width="150" height="64" rx="12" fill="#d9ecff" stroke="#333" stroke-width="3"/>
  <text x="95" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">can</text>
  <rect x="170" y="56" width="20" height="12" fill="#333"/>
  <rect x="190" y="30" width="150" height="64" rx="6" fill="#fff3c4" stroke="#333" stroke-width="3"/>
  <text x="265" y="72" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#222">swim</text>
  <circle cx="50" cy="104" r="10" fill="#333"/><circle cx="140" cy="104" r="10" fill="#333"/>
  <circle cx="220" cy="104" r="10" fill="#333"/><circle cx="310" cy="104" r="10" fill="#333"/>
  <text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Lok</text>
  <text x="180" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">keine Kupplung</text>
  <text x="265" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#222">Wagen</text>
</svg>
